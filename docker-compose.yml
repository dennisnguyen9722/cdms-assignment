services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms
      POSTGRES_DB: cdms
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cdms" ]
      interval: 5s
      timeout: 3s
      retries: 5
  vietful:
    build: ./apps/vietful-emulator
    ports:
      - "3001:3001"
  cdms:
    build: ./apps/cdms
    environment:
      DATABASE_URL: postgresql://cdms:cdms@postgres:5432/cdms
      VIETFUL_URL: http://vietful:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      vietful:
        condition: service_started
volumes:
  pgdata:
