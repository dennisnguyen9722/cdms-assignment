services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms
      POSTGRES_DB: cdms
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdms"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
